<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boutique Blossom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fffafc;
      color: #2b2226;
      font-family: Arial, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      max-width: 1150px;
      margin: auto;
      padding: 24px 18px 60px;
    }

   /* ================= HEADER ================= */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 22px;
}

.brand {
  font-size: 24px;
  font-weight: 800;
  color: #9b5575;
  white-space: nowrap;
}

.brand-small {
  font-size: 12px;
  color: #a98b98;
  margin-top: 3px;
}

/* Mobile */
@media (max-width: 700px) {
  .top-bar {
    gap: 8px;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .brand {
    font-size: 20px;
  }

  .brand-small {
    font-size: 10px;
  }
}

    /* ================= PRODUCT ================= */

    .product-section {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 42px;
      align-items: start;
    }

    /* Images */

    .gallery {
      position: sticky;
      top: 18px;
    }

    .main-image-wrap {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #f3e9ee;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(100, 50, 75, 0.08);
    }

    .main-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .product-colors { margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .product-colors-label { font-size:13px; font-weight:700; color:#65575d; margin-inline-end:2px; }
    .color-option { width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px #d8cbd1; padding:0; transition:.18s; }
    .color-option.active { box-shadow:0 0 0 2px #a45f7d; transform:scale(1.08); }

    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumbnail {
      flex: 0 0 72px;
      width: 72px;
      height: 88px;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      background: #f3e9ee;
    }

    .thumbnail.active {
      border-color: #a45f7d;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Product info */

    .product-info {
      padding-top: 8px;
    }

    .category {
      display: inline-block;
      font-size: 13px;
      color: #a15e7c;
      background: #f6e8ef;
      padding: 7px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .product-name {
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1.15;
      margin: 0 0 14px;
      color: #30252a;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .price {
      font-size: 27px;
      font-weight: 800;
      color: #9b5575;
    }

    .old-price {
      font-size: 17px;
      color: #a99ca2;
      text-decoration: line-through;
    }

    .description {
      font-size: 16px;
      line-height: 1.9;
      color: #65575d;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    .divider {
      height: 1px;
      background: #eadde3;
      margin: 22px 0;
    }

    /* ================= ORDER ================= */

    .order-box {
      background: white;
      border: 1px solid #eadde3;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(100, 50, 75, 0.05);
    }

    .order-title {
      margin: 0 0 5px;
      font-size: 22px;
    }

    .order-subtitle {
      margin: 0 0 20px;
      color: #8b7c83;
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #ddd0d7;
      border-radius: 11px;
      padding: 13px 14px;
      background: #fff;
      color: #30252a;
      outline: none;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #b36b8a;
      box-shadow: 0 0 0 3px rgba(179, 107, 138, 0.10);
    }

    .field textarea {
      min-height: 85px;
      resize: vertical;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .delivery-summary {
      background: #fff7fa;
      border-radius: 13px;
      padding: 14px;
      margin: 16px 0;
      border: 1px solid #f0dce5;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #66575e;
    }

    .summary-line:last-child {
      margin-bottom: 0;
    }

    .summary-total {
      font-size: 18px;
      font-weight: 800;
      color: #9b5575;
      border-top: 1px solid #eadde3;
      padding-top: 10px;
      margin-top: 10px;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 16px;
      background: #9b5575;
      color: white;
      font-size: 17px;
      font-weight: 800;
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #874765;
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ================= ORDER LIMIT OVERLAY ================= */
    #order-limit-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .order-limit-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(43, 34, 38, 0.38);
      backdrop-filter: blur(3px);
    }

    .order-limit-card {
      position: relative;
      width: min(500px, 100%);
      background: #fff;
      border-radius: 22px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(50, 25, 40, 0.22);
    }

    /* ================= STATES ================= */

    .loading,
    .error-box,
    .success-box {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .message-card {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 22px;
      padding: 35px 25px;
      box-shadow: 0 15px 40px rgba(80, 40, 60, 0.08);
    }

    .message-card h2 {
      margin-top: 0;
    }

    .success-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      background: #9b5575;
      color: white;
      text-decoration: none;
      border-radius: 11px;
    }

    /* ================= BLOSSOM VISUAL UPGRADE ================= */
    :root {
      --pink: #ff2e88;
      --pink-deep: #e0117a;
      --pink-soft: #b85f82;
      --bg: #fffafc;
      --card: #ffffff;
      --text: #241a20;
      --muted: #8a7680;
      --line: rgba(73, 42, 57, .12);
    }

    body {
      background:
        radial-gradient(circle at 12% 12%, rgba(255,46,136,.055), transparent 28%),
        radial-gradient(circle at 88% 30%, rgba(184,95,130,.045), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: 'Tajawal', 'Poppins', Arial, sans-serif;
    }

    .page {
      max-width: 1280px;
      padding: 0 28px 70px;
    }

    .top-bar {
      height: 76px;
      margin: 0 0 54px;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,250,252,.90);
      backdrop-filter: blur(16px);
    }

    .top-bar .brand-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      line-height: 1;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 25px;
      letter-spacing: -.02em;
      color: var(--pink-soft);
    }

    .brand-small {
      font-family: 'Poppins', sans-serif;
      font-size: 8px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b59ba8;
      margin-top: 5px;
    }

    .landing-header-actions{display:flex;align-items:center;gap:8px;}
    .lang-switch{display:flex;align-items:center;gap:2px;background:rgba(184,95,130,.08);border-radius:999px;padding:3px;}
    .lang-switch button{border:0;background:transparent;color:#806e77;padding:6px 8px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;}
    .lang-switch button.active{background:var(--pink-soft);color:#fff;}
    .landing-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .landing-nav a, .landing-theme {
      border: 0;
      background: transparent;
      color: #806e77;
      text-decoration: none;
      font-size: 13px;
      padding: 8px 11px;
      border-radius: 999px;
      transition: .2s ease;
    }

    .landing-nav a:hover, .landing-theme:hover {
      color: var(--pink-deep);
      background: rgba(255,46,136,.07);
    }

    .landing-theme {
      border: 1px solid var(--line);
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 16px;
    }

    .product-section {
      grid-template-columns: minmax(0, 1.08fr) minmax(430px, .92fr);
      gap: 58px;
      align-items: start;
      max-width: 1160px;
      margin: 0 auto;
    }

    .gallery {
      position: sticky;
      top: 104px;
    }

    .main-image-wrap {
      aspect-ratio: 4 / 5;
      max-height: 720px;
      border-radius: 24px;
      background: #f4e8ee;
      box-shadow: 0 24px 65px rgba(77,35,57,.14);
      position: relative;
    }

    .main-image-wrap::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 18px;
      pointer-events: none;
    }

    .main-image {
      object-fit: cover;
      transition: transform .45s cubic-bezier(.22,.75,.28,1);
    }

    .main-image-wrap:hover .main-image {
      transform: scale(1.018);
    }

    .thumbnails {
      gap: 12px;
      margin-top: 15px;
    }

    .thumbnail {
      flex-basis: 78px;
      width: 78px;
      height: 94px;
      border-radius: 13px;
      border: 2px solid transparent;
      box-shadow: 0 6px 18px rgba(65,35,48,.06);
    }

    .product-info {
      padding-top: 16px;
    }

    .category {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--pink-soft);
      background: #fff0f6;
      border: 1px solid #f7dbe8;
      padding: 8px 13px;
      margin-bottom: 17px;
    }

    .product-name {
      font-family: 'Tajawal', sans-serif;
      font-size: clamp(34px, 4vw, 52px);
      font-weight: 800;
      line-height: 1.08;
      color: #241a20;
      margin-bottom: 17px;
    }

    .price-row {
      gap: 13px;
      margin-bottom: 22px;
    }

    .price {
      font-family: 'Poppins', sans-serif;
      font-size: 29px;
      color: var(--pink-deep);
    }

    .description {
      font-size: 16px;
      line-height: 2;
      color: #75646d;
      background: rgba(255,255,255,.58);
      border-right: 3px solid #f2c9da;
      padding: 12px 16px;
      border-radius: 10px;
    }

    .divider {
      background: var(--line);
      margin: 27px 0;
    }

    .order-box {
      background: rgba(255,255,255,.88);
      border: 1px solid #ecdce4;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 18px 45px rgba(72,35,55,.09);
    }

    .order-title {
      font-size: 24px;
      font-weight: 800;
      color: #291c23;
    }

    .order-subtitle {
      color: #8a7680;
    }

    .field input, .field select, .field textarea {
      border-color: #e4d4dc;
      background: #fff;
      border-radius: 12px;
      transition: .2s;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255,46,136,.08);
    }

    .delivery-summary {
      background: #fff5f9;
      border-color: #f4dce7;
    }

    .submit-btn {
      background: linear-gradient(135deg, #ff2e88, #d91b73);
      border-radius: 13px;
      box-shadow: 0 12px 25px rgba(255,46,136,.18);
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #ed1d79, #c91467);
      box-shadow: 0 15px 30px rgba(255,46,136,.25);
    }

    /* Dark theme — same visual language as the home page */
    [data-theme="dark"] body {
      --bg: #120d11;
      --card: #1b1419;
      --text: #f8eef3;
      --muted: #bdaab4;
      --line: rgba(255,255,255,.10);
      background: radial-gradient(circle at 15% 10%, rgba(255,46,136,.10), transparent 28%), #120d11;
      color: var(--text);
    }
    [data-theme="dark"] .top-bar { background: rgba(18,13,17,.92); }
    [data-theme="dark"] .product-name,
    [data-theme="dark"] .order-title { color: #fff7fa; }
    [data-theme="dark"] .description { background: rgba(30,21,27,.72); color: #cbb8c2; }
    [data-theme="dark"] .order-box { background: rgba(27,20,25,.94); border-color: rgba(255,255,255,.10); }
    [data-theme="dark"] .field input,
    [data-theme="dark"] .field select,
    [data-theme="dark"] .field textarea { background: #171116; color: #f8eef3; border-color: #3a2933; }
    [data-theme="dark"] .delivery-summary { background: #21161d; border-color: #3a2933; }
    [data-theme="dark"] .landing-nav a, [data-theme="dark"] .landing-theme { color: #c8b5bf; }
    [data-theme="dark"] .main-image-wrap { box-shadow: 0 24px 65px rgba(0,0,0,.34); }

    @media (max-width: 900px) {
      .product-section { grid-template-columns: 1fr; gap: 28px; }
      .gallery { position: static; }
      .main-image-wrap { max-height: none; }
      .product-info { padding-top: 0; }
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 800px) {
      .page {
        padding: 15px 13px 45px;
      }

      .product-section {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .gallery {
        position: static;
      }

      .product-info {
        padding-top: 0;
      }

      .main-image-wrap {
        border-radius: 17px;
      }

      .product-name {
        font-size: 32px;
      }

      .order-box {
        padding: 17px;
        border-radius: 17px;
      }
    }

    @media (max-width: 480px) {
      .top-bar {
        margin-bottom: 17px;
      }

      .brand {
        font-size: 21px;
      }

      .field-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .thumbnail {
        flex-basis: 64px;
        width: 64px;
        height: 78px;
      }
    }
  </style>

<style id="mobile-compact-overrides">
@media (max-width: 640px){
  body{font-size:13px;}
  .site-header{padding:10px 14px;gap:8px;}
  .site-header.scrolled{padding:8px 14px;}
  .brand-mark{font-size:25px;}
  .brand-sub{font-size:8px;}
  .header-right{gap:7px;}
  .lang-switch button{padding:5px 8px;font-size:10px;}
  .theme-toggle{width:32px;height:32px;}
  .product-page{padding:18px 12px 55px;}
  .product-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start;}
  .product-gallery{position:sticky;top:58px;}
  .main-photo{aspect-ratio:4/5;border-radius:14px;}
  .thumbs{gap:5px;margin-top:6px;}
  .thumbs button{width:48px;height:58px;border-radius:8px;}
  .product-info{padding:2px 0;}
  .product-category{font-size:9px;letter-spacing:.08em;margin-bottom:4px;}
  .product-title{font-size:22px;line-height:1.12;margin-bottom:7px;}
  .product-price{font-size:18px;margin-bottom:10px;}
  .product-desc{font-size:11px;line-height:1.45;margin-bottom:10px;}
  .option-label{font-size:10px;margin-bottom:5px;}
  .size-grid{gap:4px;}
  .size-btn{min-width:31px;padding:7px 6px;font-size:10px;}
  .color-grid{gap:5px;}
  .color-btn{width:25px;height:25px;}
  .qty-control{height:32px;}
  .qty-control button{width:30px;}
  .qty-control input{width:34px;font-size:11px;}
  .order-main-btn{padding:10px 12px;font-size:11px;border-radius:10px;}
  .delivery-note,.stock-note{font-size:9px;line-height:1.35;margin-top:6px;}
  .details-section{padding:28px 12px;}
  .details-section h2{font-size:22px;}
  .details-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .detail-card{padding:10px;}
  .detail-card h3{font-size:11px;}
  .detail-card p{font-size:9.5px;}
  .related-section{padding:25px 12px;}
  .related-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
  .related-card .thumb{aspect-ratio:4/5;}
  .related-card .body{padding:8px;}
  .related-card .name{font-size:11px;}
  .related-card .price{font-size:11px;}
  .modal-card{width:calc(100% - 24px);padding:16px;border-radius:16px;}
  .modal-card h2{font-size:19px;}
  .form-grid{grid-template-columns:1fr;gap:9px;}
  .form-group label{font-size:10px;}
  .form-group input,.form-group select,.form-group textarea{padding:9px 10px;font-size:11px;}
}
@media (max-width:420px){
  .product-layout{gap:9px;}
  .product-title{font-size:19px;}
  .product-desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .main-photo{border-radius:12px;}
  .thumbs button{width:40px;height:49px;}
}
</style>

<style id="desktop-compact-landing">
/* Desktop: keep the product page compact and close to the store scale */
@media (min-width: 901px){
  .page{max-width:1080px;padding:0 18px 45px;}
  .top-bar{height:64px;margin-bottom:28px;padding:0 6px;}
  .product-section{grid-template-columns:minmax(0,455px) minmax(0,455px);gap:32px;justify-content:center;}
  .gallery{top:82px;}
  .main-image-wrap{width:455px;height:555px;aspect-ratio:auto;max-height:555px;border-radius:18px;}

  .category{font-size:10px;padding:5px 9px;margin-bottom:9px;}

  .price{font-size:23px;}
  .old-price{font-size:14px;}

  .order-subtitle{font-size:11px;margin-bottom:12px;}

  .field label{font-size:11px;margin-bottom:5px;}
  .field input,.field select,.field textarea{padding:9px 10px;border-radius:9px;font-size:11px;}
  .field textarea{min-height:58px;}
  .summary{padding:9px 10px;}
  .submit-btn{padding:11px;font-size:12px;}
}
</style>

<style id="landing-info-compact-fix">
/* Keep the product information column visually compact on desktop. */
@media (min-width: 901px){
  .product-info{
    max-width:455px;
    align-self:start;
  }

  .product-description,
  .description{
    max-height:3.1em;
    overflow:hidden;
    line-height:1.5;
    margin-bottom:9px !important;
  }

  .divider{
    margin:9px 0 !important;
  }

  .order-box{
    padding:12px !important;
  }

  .order-title{
    margin-bottom:3px !important;
  }

  .order-subtitle{
    margin-bottom:8px !important;
  }

  .field{
    margin-bottom:6px !important;
  }

  .field label{

    /* Order limit: 2 active orders per product on this device.
       Deleted orders do not count.
       A new cycle starts only after the current 2 orders are both DONE. */
    function getDeviceId() {
      const key = 'blossom_device_id';
      try {
        let id = localStorage.getItem(key);
        if (!id) {
          id = 'd' + Date.now() + Math.random().toString(36).slice(2, 10);
          localStorage.setItem(key, id);
        }
        return id;
      } catch (e) {
        return 'd-fallback-' + Math.random().toString(36).slice(2, 10);
      }
    }

    const deviceId = getDeviceId();
    let activeOrderCount = 0;

    function showOrderLimitReached() {
      if (document.getElementById('order-limit-overlay')) return;
      const overlay = document.createElement('div');
      overlay.id = 'order-limit-overlay';
      overlay.innerHTML = `
        <div class="order-limit-backdrop"></div>

          <button type="button" class="back-btn" id="order-limit-close">حسنًا</button>
        </div>
      `;
      document.body.appendChild(overlay);
      const close = document.getElementById('order-limit-close');
      if (close) close.onclick = () => overlay.remove();

    function hideOrderLimitReached() {

      if (overlay) overlay.remove();

    async function getActiveOrderCount() {
      if (!currentProduct?.id || !deviceId) return 0;

      try {
        const { data, error } = await supabaseClient.rpc('get_order_cycle_count', {
          p_product_id: currentProduct.id,
          p_device_id: deviceId
        });

        if (error) throw error;

        return Math.min(Number(data) || 0, 2);
      } catch (e) {
        console.error('ORDER LIMIT CHECK ERROR:', e);
        return 0;
      }
    }

    async function refreshOrderAvailability() {
      activeOrderCount = await getActiveOrderCount();
      if (activeOrderCount >= 2) {
        showOrderLimitReached();

        hideOrderLimitReached();

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    function getLandingLang(){ return localStorage.getItem('blossom07:lang') || localStorage.getItem('blossom:lang') || 'ar'; }
    function landingText(value, fallback = '') {
      if (!value) return fallback;
      if (typeof value === 'object') return value[getLandingLang()] || value.ar || value.fr || value.en || fallback;
      try { const parsed = JSON.parse(value); if (parsed && typeof parsed === 'object') return parsed[getLandingLang()] || parsed.ar || parsed.fr || parsed.en || fallback; return parsed; } catch { return value; }
    }

    function parseTranslation(value, fallback = '') {
      if (!value) return fallback;

      if (typeof value === 'object') {
        return value[getLandingLang()] || value.ar || value.fr || value.en || fallback;
      }

      try {
        const parsed = JSON.parse(value);

        if (typeof parsed === 'object') {
          return parsed[getLandingLang()] || parsed.ar || parsed.fr || parsed.en || fallback;
        }

        return parsed;
      } catch {
        return value;
      }
    }


    function formatPrice(value) {
      return Number(value || 0).toLocaleString('fr-FR');
    }


    function phoneIsValid(value) {
      return /^0[567]\d{8}$/.test(
        String(value || '').replace(/\s+/g, '')
      );
    }


    /* =========================================================

    ========================================================= */

    function defaultDelivery() {
      const home = {};
      const office = {};

      WILAYAS.forEach(([code]) => {
        home[code] = 0;
        office[code] = 0;
      });

      return {
        home,
        office,
        defaultHome: 0,
        defaultOffice: 0
      };
    }


    function normalizeDelivery(data) {
      const base = defaultDelivery();

      if (data) {
        Object.assign(base.home, data.home || {});
        Object.assign(base.office, data.office || {});

        if (Number.isFinite(Number(data.defaultHome))) {
          base.defaultHome = Number(data.defaultHome);
        }

        if (Number.isFinite(Number(data.defaultOffice))) {
          base.defaultOffice = Number(data.defaultOffice);
        }
      }

      return base;
    }


    function deliveryPrice(type, code) {
      const d = normalizeDelivery(deliverySettings);

      const table = type === 'home'
        ? d.home
        : d.office;

      const specific = code ? Number(table[code]) : 0;

      if (
        code &&
        Number.isFinite(specific) &&
        specific > 0
      ) {
        return specific;
      }

      return type === 'home'
        ? Number(d.defaultHome || 0)
        : Number(d.defaultOffice || 0);
    }


    function initMetaPixel() {
      const pixelId = String(trackingSettings?.metaPixelId || '').trim();
      if (!pixelId) {
        console.info('[Meta Pixel TEST] PageView (Pixel ID not set)');
        return;
      }
      if (metaPixelInitialized) return;
      if (!/^\d+$/.test(pixelId)) {
        console.warn('Invalid Meta Pixel ID');
        return;
      }

      window.fbq = window.fbq || function() {
        window.fbq.callMethod ? window.fbq.callMethod.apply(window.fbq, arguments) : window.fbq.queue.push(arguments);
      };
      if (!window._fbq) window._fbq = window.fbq;
      window.fbq.push = window.fbq;
      window.fbq.loaded = true;
      window.fbq.version = '2.0';
      window.fbq.queue = [];
      window.fbq('init', pixelId);
      window.fbq('track', 'PageView');

      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://connect.facebook.net/en_US/fbevents.js';
      document.head.appendChild(script);

      metaPixelInitialized = true;
    }

    function trackMetaEvent(eventName, params = {}) {
      if (!metaPixelInitialized || typeof window.fbq !== 'function') {
        console.info('[Meta Pixel TEST]', eventName, params);
        return;
      }
      window.fbq('track', eventName, params);
    }

          .select('data')

        if (error) throw error;

        const settings = data && data.data ? data.data : {};
        deliverySettings = settings.delivery || defaultDelivery();
        trackingSettings = {
          metaPixelId: String(settings.tracking?.metaPixelId || '').trim()

        console.error('DELIVERY SETTINGS ERROR:', error);

    /* =========================================================

    async function loadProduct() {

      if (!productId) {
        showError('لم يتم تحديد المنتج.');
        return;
      }

      try {

        const { data: product, error: productError } =
          await supabaseClient
            .from('products')
            .select('*')
            .eq('id', productId)
            .single();

        if (productError) {
          throw productError;
        }

        currentProduct = product;

        /* ---------- Product colors ---------- */
        const { data: colorRows, error: colorsError } = await supabaseClient
          .from('product_colors')
          .select('id,name,color_value,sort_order')
          .eq('product_id', productId)
          .order('sort_order', { ascending: true })
          .order('id', { ascending: true });
        if (colorsError) throw colorsError;

        productColors = [];
        if (colorRows && colorRows.length) {
          const colorIds = colorRows.map(c => c.id);
          const { data: colorImageRows, error: colorImagesError } = await supabaseClient
            .from('product_color_images')
            .select('color_id,image_url,sort_order')
            .in('color_id', colorIds)
            .order('sort_order', { ascending: true })
            .order('id', { ascending: true });
          if (colorImagesError) throw colorImagesError;
          productColors = colorRows.map(color => ({
            id: color.id, name: color.name, value: color.color_value,
            images: (colorImageRows || []).filter(image => image.color_id === color.id).map(image => image.image_url).filter(Boolean)
          }));
        }
        selectedColor = productColors[0] || null;

        /* ---------- Main product image ---------- */
        currentImages = [];
        if (selectedColor && selectedColor.images.length) currentImages = [...selectedColor.images];
        else if (product.image) currentImages.push(product.image);


        if (!currentImages.length) {
          currentImages.push(
            'https://via.placeholder.com/800x1000?text=Boutique+Blossom'
          );
        }

        currentImageIndex = 0;

        // Render the main product immediately. Extra gallery images load after.
        renderProduct();
        trackMetaEvent('ViewContent', {
          content_ids: [String(currentProduct.id)],
          content_name: productNameForTracking(),
          content_type: 'product',
          value: Number(currentProduct.price || 0),
          currency: 'DZD'
        });

        /* ---------- Additional images (background) ---------- */
        const { data: extraImages, error: imagesError } =
          await supabaseClient
            .from('product_images')
            .select('image_url')
            .eq('product_id', productId)
            .order('id', { ascending: true });

        if (imagesError) {
          console.error(
            'PRODUCT IMAGES ERROR:',
            imagesError
          );
          return;
        }

        if (!selectedColor && extraImages && extraImages.length) {
          extraImages.forEach(item => {
            if (item.image_url && !currentImages.includes(item.image_url)) currentImages.push(item.image_url);
          });
        }

        renderThumbnails();
        renderColorOptions();

      } catch (error) {

        console.error('PRODUCT ERROR:', error);

        showError('تعذر تحميل المنتج.');

    }

    function renderThumbnails() {

      const container =
        document.getElementById('thumbnails');

      if (!container) return;


      container.innerHTML =
        currentImages.map(
          (image, index) => `

            <button
              type="button"
              class="thumbnail ${index === 0 ? 'active' : ''}"
              data-image-index="${index}"
            >

              <img
                src="${escapeHtml(image)}"
                alt="صورة ${index + 1}"
                loading="lazy"
              >

            </button>

          `
        ).join('');


      container
        .querySelectorAll('.thumbnail')
        .forEach(button => {

          button.addEventListener(
            'click',
            () => {

              const index =
                Number(
                  button.dataset.imageIndex
                );

              changeMainImage(index);

            }
          );

        });

    }


    function changeMainImage(index) {

      if (!currentImages[index]) return;

      currentImageIndex = index;


      const mainImage =
        document.getElementById(
          'main-product-image'
        );

      if (mainImage) {
        mainImage.src =
          currentImages[index];
      }


      document
        .querySelectorAll('.thumbnail')
        .forEach((button, i) => {

          button.classList.toggle(
            'active',
            i === index
          );

        });

    }

        wilayaSelect.addEventListener(
          'change',
          updateOrderSummary
        );
      }


      if (quantityInput) {
        quantityInput.addEventListener(
          'input',
          updateOrderSummary
        );
      }


      if (form) {
        form.addEventListener(
          'submit',
          submitOrder
        );
      }


      updateAddressRequirement();

    }


    function updateAddressRequirement() {

      const delivery =
        document.getElementById(
          'order-delivery'
        );

      const address =
        document.getElementById(
          'order-address'
        );

      const label =
        document.getElementById(
          'address-label'
        );


      if (!delivery || !address || !label) {
        return;
      }


      if (delivery.value === 'home') {

        address.required = true;
        label.textContent =
          'العنوان *';

      } else {

        address.required = false;
        label.textContent =
          'العنوان (اختياري)';

      }

    }


    function updateOrderSummary() {

      if (!currentProduct) return;


      const quantityInput =
        document.getElementById(
          'order-qty'
        );

      const deliverySelect =
        document.getElementById(
          'order-delivery'
        );

      const wilayaSelect =
        document.getElementById(
          'order-wilaya'
        );


      const quantity =
        Math.max(
          1,
          Number(quantityInput?.value || 1)
        );


      const subtotal =
        Number(currentProduct.price || 0) *
        quantity;


      const delivery =
        deliveryPrice(
          deliverySelect?.value || 'home',
          wilayaSelect?.value || ''
        );


      const total =
        subtotal + delivery;


      const productEl =
        document.getElementById(
          'summary-product'
        );

      const deliveryEl =
        document.getElementById(
          'summary-delivery'
        );

      const totalEl =
        document.getElementById(
          'summary-total'
        );


      if (productEl) {
        productEl.textContent =
          `${formatPrice(subtotal)} DA`;
      }


      if (deliveryEl) {

        deliveryEl.textContent =
          delivery > 0
            ? `${formatPrice(delivery)} DA`
            : 'يحدد لاحقًا';

      }


      if (totalEl) {

        totalEl.textContent =
          `${formatPrice(total)} DA`;

      }

    }


    /* =========================================================
       SUBMIT ORDER
    ========================================================= */

    async function submitOrder(event) {

      event.preventDefault();


      if (!currentProduct) {
        return;
      }

      activeOrderCount = await getActiveOrderCount();
      if (activeOrderCount >= 2) {
        showOrderLimitReached();
        return;
      }


      const button =
        document.getElementById(
          'submit-order-btn'
        );


      const name =
        document.getElementById(
          'order-name'
        ).value.trim();


      const phone =
        document.getElementById(
          'order-phone'
        ).value
          .replace(/\s+/g, '')
          .trim();


      const size =
        document.getElementById(
          'order-size'
        ).value;


      const quantity =
        Math.max(
          1,
          Number(
            document.getElementById(
              'order-qty'
            ).value
          ) || 1
        );


      const deliveryType =
        document.getElementById(
          'order-delivery'
        ).value;


      const wilayaCode =
        document.getElementById(
          'order-wilaya'
        ).value;


      const address =
        document.getElementById(
          'order-address'
        ).value.trim();


      const note =
        document.getElementById(
          'order-note'
        ).value.trim();


      /* ---------- Validation ---------- */

      if (!name) {
        alert('يرجى إدخال الاسم.');
        return;
      }


      if (!phoneIsValid(phone)) {
        alert(
          'يرجى إدخال رقم هاتف جزائري صحيح.'
        );
        return;
      }


      if (!size) {
        alert(
          'يرجى اختيار المقاس.'
        );
        return;
      }


      if (productColors.length && !selectedColor) {
        alert('يرجى اختيار اللون.');
        return;
      }

      if (!wilayaCode) {
        alert(
          'يرجى اختيار الولاية.'
        );
        return;
      }


      if (
        deliveryType === 'home' &&
        !address
      ) {
        alert(
          'يرجى إدخال العنوان.'
        );
        return;
      }


      trackMetaEvent('InitiateCheckout', {
        content_ids: [String(currentProduct.id)],
        content_name: productNameForTracking(),
        content_type: 'product',
        value: Number(currentProduct.price || 0) * quantity,
        currency: 'DZD'
      });

      /* ---------- Disable button ---------- */

      if (button) {

        button.disabled = true;

        button.textContent =
          'جاري إرسال الطلب...';

      }


      try {

        const wilaya =
          WILAYAS.find(
            item => item[0] === wilayaCode
          );


        const wilayaName =
          wilaya
            ? wilaya[1]
            : '';


        const unitPrice =
          Number(
            currentProduct.price || 0
          );


        const subtotal =
          unitPrice * quantity;


        const deliveryFee =
          deliveryPrice(
            deliveryType,
            wilayaCode
          );


        const total =
          subtotal + deliveryFee;


        const productName =
          parseTranslation(
            currentProduct.name,
            'منتج'
          );


        /* ---------- Same order structure
           used by existing Admin ---------- */

        const order = {

          id:
            'o' +
            Date.now() +
            Math.random()
              .toString(36)
              .slice(2, 7),


          items: [

            {

              productId:
                currentProduct.id,

              productName:
                productName,

              price:
                unitPrice,

              size:
                size,

              qty:
                quantity,

              color:
                selectedColor ? selectedColor.name : '',

              image:
                currentImages[0] || ''

            }

          ],


          productId:
            currentProduct.id,


          deviceId:
            deviceId,


          productName:
            productName,


          price:
            subtotal,


          qty:
            quantity,


          size:
            size,


          color:
            selectedColor ? selectedColor.name : '',


          subtotal:
            subtotal,


          deliveryType:
            deliveryType,


          deliveryFee:
            deliveryFee,


          total:
            total,


          wilayaCode:
            wilayaCode,


          wilayaName:
            wilayaName,


          name:
            name,


          phone:
            phone,


          address:
            address,


          note:
            note,


          status:
            'new',


          createdAt:
            new Date().toISOString()

        };


        console.log(
          'ORDER TO SEND:',
          order
        );


        /* ---------- Save to existing
           Supabase orders table ---------- */

        const { error } =
          await supabaseClient
            .from('orders')
            .insert({

              id:
                order.id,

              data:
                order,

              created_at:
                order.createdAt,

              updated_at:
                order.createdAt

            });


        if (error) {
          throw error;
        }


        console.log(
          'ORDER SAVED SUCCESSFULLY'
        );

// Convert DZD to EUR only for Meta Purchase event
const DZD_TO_EUR_RATE = 0.0068;
const totalEUR = Number((total * DZD_TO_EUR_RATE).toFixed(2));

console.log('PURCHASE TRACKING REACHED', {
  total,
  totalEUR,
  productId: currentProduct.id
});

console.log('META STATUS', {
  initialized: metaPixelInitialized,
  fbqExists: typeof window.fbq === 'function',
  pixelId: trackingSettings.metaPixelId
});

trackMetaEvent('Purchase', {
  content_ids: [String(currentProduct.id)],
  content_name: productNameForTracking(),
  content_type: 'product',
  value: totalEUR,
  currency: 'EUR'
});

        /* ---------- Send order notification to Telegram ---------- */
        try {
          const { data: telegramData, error: telegramError } =
            await supabaseClient.functions.invoke('telegram-order', {
              body: { data: order }
            });

          if (telegramError) {
            console.error('TELEGRAM NOTIFICATION ERROR:', telegramError);
          } else {
            console.log('TELEGRAM NOTIFICATION SENT:', telegramData);
          }
        } catch (telegramError) {
          console.error('TELEGRAM NOTIFICATION ERROR:', telegramError);
        }

        activeOrderCount += 1;

        showSuccess(
          order
        );


      } catch (error) {

        console.error(
          'CREATE ORDER ERROR:',
          error
        );


        alert(
          'حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.'
        );


        if (button) {

          button.disabled = false;

          button.textContent =
            'تأكيد الطلب';

        }

      }

    }


    /* =========================================================
       SUCCESS
    ========================================================= */

    function showSuccess(order) {

      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="success-box">

          <div class="message-card">

            <div class="success-icon">
              ✓
            </div>

            <h2>
              تم إرسال طلبك بنجاح ❤️
            </h2>

            <p>
              شكراً لك ${escapeHtml(order.name)}.
            </p>

            <p>
              سنتواصل معك على الرقم
              <strong>
                ${escapeHtml(order.phone)}
              </strong>
              لتأكيد الطلب.
            </p>

            <a
              href="/"
              class="back-btn"
            >
              العودة إلى الصفحة الرئيسية
            </a>

          </div>

        </div>

      `;

    }


    /* =========================================================
       ERROR
    ========================================================= */

    function showError(message) {

      document.getElementById(
        'app'
      ).innerHTML = `

        <div class="error-box">

          <div class="message-card">

            <h2>
              عذراً
            </h2>

            <p>
              ${escapeHtml(message)}
            </p>

            <a
              href="/"
              class="back-btn"
            >
              العودة للمتجر
            </a>

          </div>

        </div>

      `;

    }


    /* =========================================================
       START
    ========================================================= */

    async function init() {

      // Load tracking settings first so Meta Pixel is ready before product events fire.
      await loadDeliverySettings();
      await loadProduct();

      if (currentProduct) {
        await refreshOrderAvailability();
      }

    }


    init();

  </script>


  <script>
    (function(){
      const lang = getLandingLang();
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-landing-lang]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.landingLang === lang);
        btn.addEventListener('click', () => {
          localStorage.setItem('blossom07:lang', btn.dataset.landingLang);
          localStorage.setItem('blossom:lang', btn.dataset.landingLang);
          window.location.reload();
        });
      });
      const labels = {en:{home:'Home',shop:'Shop',contact:'Contact'},fr:{home:'Accueil',shop:'Boutique',contact:'Contact'},ar:{home:'الرئيسية',shop:'المتجر',contact:'تواصل'}}[lang] || {};
      document.querySelectorAll('[data-lkey]').forEach(el => { if(labels[el.dataset.lkey]) el.textContent = labels[el.dataset.lkey]; });
    })();
  </script>

  <script>
    (function(){
      const saved = localStorage.getItem('blossom-theme') || localStorage.getItem('blossom07:theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      const btn = document.getElementById('landing-theme-toggle');
      const update = () => {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (btn) btn.textContent = dark ? '☾' : '☼';
      };
      update();
      if (btn) btn.addEventListener('click', () => {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = dark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('blossom-theme', next); localStorage.setItem('blossom07:theme', next);
        update();
      });
    })();
  </script>
