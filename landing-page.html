<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boutique Blossom</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

 <h1 id="product-name">جاري تحميل المنتج...</h1>

  <script>
    const SUPABASE_URL = 'https://wvhflttbfjmpbietdesz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_1WtyyuxzYgJIDqZKGKmMsg_K9nT0oeI';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    console.log('Supabase connected');

async function loadProduct() {
  const { data, error } = await supabaseClient
    .from('products')
    .select('*')
    .eq('id', new URLSearchParams(window.location.search).get('product'))
    .single();

  if (error) {
    console.error('PRODUCT ERROR:', error);
    document.getElementById('product-name').textContent = 'حدث خطأ';
    return;
  }

  const name = JSON.parse(data.name);

  document.getElementById('product-name').textContent = name.ar;

  console.log('PRODUCT:', data);
}

loadProduct();
  </script>

</body>
</html>
