<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique Blossom</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/landing.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="page">

  <!-- Same storefront header structure -->

  <header class="site-header sample-header">

```
<div class="sample-nav-left">

  <a
    class="sample-nav-link active"
    href="/"
    data-nav="shop"
    data-lkey="home"
  >
    الرئيسية
  </a>

  <a
    class="sample-nav-link"
    href="/#shop-grid"
    data-scroll="shop-grid"
    data-lkey="shop"
  >
    المتجر
  </a>

  <a
    class="sample-nav-link"
    href="/?contact=1"
    data-lkey="contact"
  >
    تواصل
  </a>

</div>

<a
  class="sample-logo"
  href="/"
  data-nav="shop"
  aria-label="Blossom"
>
  <span class="sample-logo-flower">✿</span>
  <span>Blossom</span>
</a>

<div class="sample-header-actions">

  <div class="lang-switch" aria-label="Language">

    <button
      type="button"
      data-lang="en"
      data-landing-lang="en"
    >
      EN
    </button>

    <button
      type="button"
      data-lang="fr"
      data-landing-lang="fr"
    >
      FR
    </button>

    <button
      type="button"
      data-lang="ar"
      data-landing-lang="ar"
    >
      ع
    </button>

  </div>

  <button
    class="theme-toggle sample-icon-btn"
    id="theme-toggle-btn"
    data-landing-theme-toggle
    type="button"
    title="Toggle theme"
    aria-label="تبديل الوضع"
  >
    <svg
      id="theme-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    ></svg>
  </button>

</div>
```

  </header>

  <main id="app"></main>

</div>

<!--
  Same rule as the shop:
  each file owns one job.
-->

<script src="../js/src/config.js"></script>

<script src="../js/src/i18n.js"></script>

<script src="js/landing-tracking.js"></script>

<script src="js/landing-product.js"></script>

<script src="js/landing-order.js"></script>

</body>
</html>
