<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blossom07 — Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff2e88;
  --pink-deep:#e0117a;
  --pink-light:#ffe0ef;
  --pink-pale:#fff5fa;
  --plum:#221722;
  --plum-soft:#8a7686;
  --cream:#fffdfc;
  --gold:#c79a4b;
  --sage:#8fae7c;
  --white:#ffffff;
  --ink:#150f14;
  --line:rgba(43,31,40,0.10);
  --line-strong:rgba(43,31,40,0.18);
  --shadow:0 14px 32px rgba(255,46,136,0.16);
  --shadow-lg:0 30px 70px rgba(21,15,20,0.20);
  --radius:18px;
  --radius-lg:26px;
  --ease:cubic-bezier(.22,.75,.28,1);
  --font-body:'Poppins',sans-serif;
  --font-display:'Playfair Display',serif;
  --font-script:'Caveat',cursive;
  --white:#ffffff;
  --header-bg:rgba(255,253,252,0.86);
  --header-bg-scrolled:rgba(255,253,252,0.96);
  --overlay-bg:rgba(35,10,28,0.55);
  --input-bg:var(--pink-pale);
  --theme-transition:background .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease;
}
[data-theme="dark"]{
  --cream:#130d11;
  --plum:#f4ecf0;
  --plum-soft:#c3a5b3;
  --pink-light:#3a1f2c;
  --pink-pale:#241a20;
  --pink-deep:#ff5fa4;
  --white:#1c1418;
  --ink:#0c0810;
  --line:rgba(255,255,255,0.10);
  --line-strong:rgba(255,255,255,0.18);
  --shadow:0 14px 32px rgba(0,0,0,0.4);
  --shadow-lg:0 30px 70px rgba(0,0,0,0.55);
  --header-bg:rgba(19,13,17,0.86);
  --header-bg-scrolled:rgba(19,13,17,0.95);
  --overlay-bg:rgba(0,0,0,0.65);
  --input-bg:#241a20;
}
[dir="rtl"]{ --font-body:'Tajawal',sans-serif; }
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--plum);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:var(--theme-transition);
}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--pink);color:#fff;}

/* ===== Motion ===== */
@keyframes fadeInUp{ from{opacity:0;transform:translateY(22px);} to{opacity:1;transform:translateY(0);} }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes scaleIn{ from{opacity:0;transform:scale(.94) translateY(8px);} to{opacity:1;transform:scale(1) translateY(0);} }
@keyframes floatBlob{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-14px,18px) scale(1.06);} }
@keyframes floatBlob2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(16px,-14px) scale(1.08);} }
@keyframes shimmer{ 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
@keyframes drawCheck{ from{stroke-dashoffset:36;} to{stroke-dashoffset:0;} }
@keyframes popIn{ 0%{transform:scale(.4);opacity:0;} 70%{transform:scale(1.08);opacity:1;} 100%{transform:scale(1);} }
@keyframes heroKen{ from{transform:scale(1.08) translateY(var(--parallax,0px));} to{transform:scale(1.14) translateY(var(--parallax,0px));} }
@keyframes skeletonPulse{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
.reveal-left{opacity:0;transform:translateX(-32px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal-left.in{opacity:1;transform:translateX(0);}
.reveal-right{opacity:0;transform:translateX(32px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal-right.in{opacity:1;transform:translateX(0);}
.reveal-scale{opacity:0;transform:scale(.94);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal-scale.in{opacity:1;transform:scale(1);}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  .reveal,.reveal-left,.reveal-right,.reveal-scale{opacity:1;transform:none;}
}

/* ===== Header ===== */
.site-header{
  position:sticky;top:0;z-index:40;
  background:var(--header-bg);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);
  padding:18px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  transition:padding .35s var(--ease),box-shadow .35s var(--ease),background .35s var(--ease);
}
.site-header.scrolled{ padding:10px 28px; box-shadow:0 10px 26px rgba(21,15,20,0.08); background:var(--header-bg-scrolled); }
.brand{display:flex;align-items:center;gap:10px;transition:opacity .2s;}
.brand:hover{opacity:.75;}
.brand-mark{
  font-family:var(--font-script);
  font-weight:700;
  font-size:32px;
  color:var(--pink);
  line-height:1;
}
.brand-sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--plum-soft);font-weight:600;}
.header-right{display:flex;align-items:center;gap:16px;}
.lang-switch{display:flex;background:var(--pink-pale);border-radius:999px;padding:3px;gap:2px;}
.lang-switch button{
  border:none;background:transparent;padding:6px 12px;border-radius:999px;
  font-size:12.5px;font-weight:600;color:var(--plum-soft);letter-spacing:.02em;
  transition:.25s var(--ease);
}
.lang-switch button.active{background:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(255,46,126,0.35);}
.theme-toggle{
  display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--white);color:var(--plum);flex:none;
  transition:.25s var(--ease);
}
.theme-toggle:hover{border-color:var(--pink);color:var(--pink-deep);}
.theme-toggle svg{width:17px;height:17px;}

/* ===== Hero (full-bleed editorial) ===== */
.hero{
  position:relative;overflow:hidden;
  min-height:min(92vh,860px);
  display:flex;align-items:flex-end;
  color:#fff;padding:0;
  isolation:isolate;
}
.hero-bg{
  position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(150deg,#3a1f2e,#1b1116);
}
.hero-bg.img-broken{background:linear-gradient(150deg,#ff6fa8,#e0117a);}
.hero-bg img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;
  transform:scale(1.08);
  transition:transform 1.2s var(--ease);
  will-change:transform;
}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(15,9,13,0.86) 0%,rgba(15,9,13,0.42) 42%,rgba(15,9,13,0.18) 68%,rgba(15,9,13,0.30) 100%);
  z-index:1;
}
.hero-bg::before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(circle at 85% 8%, rgba(255,46,136,0.28), transparent 42%);
}
.hero-content{
  position:relative;z-index:2;max-width:1180px;margin:0 auto;width:100%;
  padding:120px 28px 68px;
}
.hero-inner{position:relative;max-width:620px;}
@media(max-width:900px){
  .hero{min-height:100vh;}
  .hero-content{padding:100px 20px 48px;text-align:left;}
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.35);color:#fff;
  backdrop-filter:blur(6px);
  padding:7px 18px;border-radius:999px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:24px;font-weight:600;
  animation:fadeInUp .8s var(--ease) both;
}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(38px,6.4vw,68px);
  line-height:1.05;margin:0 0 18px;font-weight:600;color:#fff;
  letter-spacing:-.01em;
  text-shadow:0 4px 30px rgba(0,0,0,0.25);
  animation:fadeInUp .8s var(--ease) both .1s;
}
.hero h1 span{
  font-family:var(--font-script);
  color:#ffb6d5;
  font-size:1.24em;
  display:inline-block;
  animation:popIn .7s var(--ease) both .55s;
}
.hero p{font-size:17px;color:rgba(255,255,255,0.86);max-width:480px;margin:0 0 32px;line-height:1.7;animation:fadeInUp .8s var(--ease) both .2s;}
.hero-actions{display:flex;gap:14px;justify-content:flex-start;flex-wrap:wrap;animation:fadeInUp .8s var(--ease) both .3s;}
.btn{
  border:none;border-radius:999px;padding:14px 28px;font-weight:600;font-size:14.5px;
  transition:.3s var(--ease);display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 12px 26px rgba(255,46,136,0.4);}
.btn-primary:hover{box-shadow:0 16px 34px rgba(255,46,136,0.5);transform:translateY(-3px);}
.btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1.5px solid rgba(255,255,255,0.55);backdrop-filter:blur(6px);}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,0.18);transform:translateY(-3px);}
.hero-meta{
  margin-top:38px;display:flex;gap:26px;justify-content:flex-start;flex-wrap:wrap;
  font-size:13px;color:rgba(255,255,255,0.75);font-weight:500;
  animation:fadeInUp .8s var(--ease) both .4s;
}
.hero-meta span{display:flex;align-items:center;gap:7px;}
.hero-scroll-cue{
  position:absolute;bottom:26px;inset-inline-end:28px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;
  color:rgba(255,255,255,0.75);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  animation:fadeIn 1s var(--ease) both .8s;
}
.hero-scroll-cue .line{width:1px;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0.85),transparent);animation:scrollCue 1.8s ease-in-out infinite;}
@keyframes scrollCue{ 0%{opacity:.3;} 50%{opacity:1;} 100%{opacity:.3;} }
@media(max-width:640px){ .hero-scroll-cue{display:none;} }

/* ===== Ticker ===== */
.ticker-wrap{
  background:var(--pink);color:#fff;overflow:hidden;padding:11px 0;
}
.ticker-track{display:flex;gap:36px;white-space:nowrap;width:max-content;animation:tickerScroll 26s linear infinite;}
.ticker-track span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.ticker-track span::after{content:"✦";opacity:.7;font-size:10px;}
@keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

/* ===== Lookbook (editorial) ===== */
.lookbook{max-width:1180px;margin:0 auto;padding:86px 22px 30px;}
.lookbook-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:38px;flex-wrap:wrap;}
.lookbook-kicker{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink-deep);font-weight:700;margin-bottom:10px;display:block;}
.lookbook-head h2{font-family:var(--font-display);font-size:clamp(26px,3.6vw,40px);margin:0;font-weight:600;color:var(--plum);letter-spacing:-.01em;}
.lookbook-head p{font-size:14px;color:var(--plum-soft);max-width:340px;margin:10px 0 0;line-height:1.6;}
.lookbook-grid{
  display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto;gap:20px;
}
.lookbook-figure{
  position:relative;overflow:hidden;border-radius:var(--radius-lg);
  background:linear-gradient(150deg,#ffd9e8,#ffb6d5);
  box-shadow:0 20px 46px rgba(21,15,20,0.14);
}
.lookbook-figure.img-broken{background:linear-gradient(150deg,#ffd9e8,#f6c477);}
.lookbook-figure img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease);}
.lookbook-figure:hover img{transform:scale(1.06);}
.lookbook-figure .cap{
  position:absolute;left:0;right:0;bottom:0;padding:22px 22px 18px;
  background:linear-gradient(0deg,rgba(15,9,13,0.72),transparent);color:#fff;
  font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.01em;
}
.lookbook-figure.f1{grid-row:1/3;aspect-ratio:4/5.4;}
.lookbook-figure.f2{aspect-ratio:5/3.1;}
.lookbook-figure.f3{aspect-ratio:5/3.1;}
@media(max-width:820px){
  .lookbook-grid{grid-template-columns:1fr;grid-template-rows:auto;}
  .lookbook-figure.f1{grid-row:auto;aspect-ratio:4/3.4;}
}

/* ===== Categories section (grid of cards) ===== */
.cat-section{max-width:1180px;margin:0 auto;padding:20px 22px 10px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px;}
.cat-card{
  background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;transition:.3s var(--ease);
}
.cat-card:hover{border-color:var(--pink);transform:translateY(-3px);box-shadow:var(--shadow);}
.cat-card-name{font-family:var(--font-display);font-weight:600;font-size:15.5px;color:var(--plum);}
.cat-card-count{font-size:11.5px;color:var(--plum-soft);margin-top:3px;}
.cat-card-plus{
  width:30px;height:30px;flex:none;border-radius:50%;background:var(--pink-pale);color:var(--pink-deep);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;transition:.25s var(--ease);
}
.cat-card:hover .cat-card-plus{background:var(--pink);color:#fff;}

/* ===== Features row ===== */
.feature-row{
  max-width:1180px;margin:64px auto 0;padding:34px 22px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.feature-item{display:flex;align-items:flex-start;gap:12px;}
.feature-item svg{width:22px;height:22px;flex:none;color:var(--pink-deep);margin-top:2px;}
.feature-item h4{font-size:14px;margin:0 0 4px;font-weight:700;color:var(--plum);}
.feature-item p{font-size:12.5px;color:var(--plum-soft);margin:0;line-height:1.5;}

/* ===== New-arrivals grid ===== */
.new-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;margin-top:22px;}
.new-grid .card .thumb{aspect-ratio:16/11;}

/* ===== CTA banner ===== */
.cta-banner{
  max-width:1180px;margin:56px auto 0;background:var(--pink);border-radius:var(--radius-lg);
  padding:44px 40px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:26px;flex-wrap:wrap;
  box-shadow:0 24px 50px rgba(255,46,136,0.28);
}
.cta-banner h3{font-family:var(--font-display);font-size:clamp(22px,3vw,30px);margin:0 0 8px;font-weight:600;}
.cta-banner p{font-size:14px;margin:0;max-width:440px;line-height:1.6;opacity:.92;}
.cta-actions{display:flex;gap:12px;flex-wrap:wrap;}
.cta-actions .btn-primary{background:var(--plum);}
.cta-actions .btn-primary:hover{background:var(--ink);}
.cta-actions .btn-ghost{border-color:rgba(255,255,255,0.7);}
@media(max-width:720px){ .cta-banner{padding:32px 24px;} }

/* ===== Category chips ===== */
.category-bar{
  display:flex;gap:10px;overflow-x:auto;padding:22px 22px 6px;max-width:1180px;margin:0 auto;
  scrollbar-width:none;
}
.category-bar::-webkit-scrollbar{display:none;}
.chip{
  flex:none;padding:9px 20px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--white);font-size:13.5px;font-weight:600;color:var(--plum-soft);white-space:nowrap;
  transition:.18s;
}
.chip.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(255,46,136,0.3);}
.chip:hover:not(.active){border-color:var(--pink);color:var(--pink-deep);}

/* ===== Product grid ===== */
.shop-wrap{max-width:1180px;margin:0 auto;padding:18px 22px 90px;}
.shop-head{padding-top:14px;margin-bottom:6px;}
.shop-head .lookbook-kicker{margin-bottom:8px;}
.shop-head h2{font-family:var(--font-display);font-size:clamp(24px,3.2vw,34px);margin:0;font-weight:600;color:var(--plum);letter-spacing:-.01em;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px;margin-top:22px;}
.card{
  background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  transition:.45s var(--ease) box-shadow,.45s var(--ease) transform,.25s border-color;position:relative;
}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-8px);border-color:rgba(255,46,126,0.35);}
.card:hover .thumb::after{opacity:1;}
.card:hover .thumb img{transform:scale(1.08);}
.card:hover .thumb svg{transform:scale(1.08) rotate(-2deg);}
.card:hover .order-btn:not(:disabled){background:var(--pink);}
.card:hover .quick-order{opacity:1;transform:translateY(0);}
.thumb{
  aspect-ratio:4/5;position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--tc1,#ffd9e8),var(--tc2,#ffb6d5));
  overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease);}
.thumb.img-broken{display:flex;align-items:center;justify-content:center;}
.thumb.img-broken::before{
  content:"";width:46%;height:46%;opacity:.5;color:var(--plum-soft);
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.4"><path d="M4 16l4.5-6 3.5 4.5L15 11l5 7H4z"/><circle cx="8" cy="8" r="1.6"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.4"><path d="M4 16l4.5-6 3.5 4.5L15 11l5 7H4z"/><circle cx="8" cy="8" r="1.6"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>') center/contain no-repeat;
  background:var(--plum-soft);
}
.quick-order{
  position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,0.94);color:var(--plum);
  border-radius:999px;padding:9px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.03em;
  opacity:0;transform:translateY(10px);transition:.3s var(--ease);backdrop-filter:blur(4px);pointer-events:none;
}
.thumb::after{
  content:"";position:absolute;inset:0;border-radius:var(--radius) var(--radius) 0 0;
  box-shadow:inset 0 0 0 3px rgba(255,46,126,0.65);opacity:0;transition:.25s;pointer-events:none;
}
.thumb svg{width:46%;height:46%;opacity:.5;color:var(--plum-soft);transition:transform .4s ease;}
.stock-badge{
  position:absolute;top:10px;inset-inline-start:10px;background:var(--white);color:var(--plum-soft);
  font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em;
  box-shadow:0 4px 10px rgba(43,31,40,0.12);
}
.card-tag{
  position:absolute;top:10px;inset-inline-start:10px;color:#fff;
  font-size:10px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}
.card-tag.bestseller{background:var(--plum);}
.card-tag.new{background:var(--pink);}
.card-body{padding:16px 17px 18px;}
.card-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;margin-bottom:5px;}
.card-name{font-family:var(--font-display);font-weight:600;font-size:17.5px;margin:0 0 7px;line-height:1.3;color:var(--plum);}
.card-desc{font-size:12.5px;color:var(--plum-soft);line-height:1.5;margin:0 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-colors{font-size:11px;color:var(--plum-soft);font-weight:600;margin:0 0 12px;letter-spacing:.02em;}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}

  return { home, office, defaultHome:0, defaultOffice:0 };
}
function normalizeDelivery(d){
  const base=defaultDelivery();
  if(d){
    Object.assign(base.home, d.home||{}); Object.assign(base.office, d.office||{});
    if(Number.isFinite(Number(d.defaultHome))) base.defaultHome=Number(d.defaultHome);
    if(Number.isFinite(Number(d.defaultOffice))) base.defaultOffice=Number(d.defaultOffice);
  }
  return base;
}
function cartCount(){ return state.cart.reduce((n,i)=>n+Number(i.qty||0),0); }
function cartSubtotal(){ return state.cart.reduce((n,i)=>n+Number(i.price||0)*Number(i.qty||0),0); }
function phoneIsValid(v){ return /^0[567]\d{8}$/.test(String(v||'').replace(/\s+/g,'')); }
function deliveryPrice(type, code){
  const d=normalizeDelivery(state.settings && state.settings.delivery);
  const table=type==='home'?d.home:d.office;
  const specific=code && Number(table[code]);
  if(code && Number.isFinite(specific) && specific>0) return specific;
  return type==='home'?Number(d.defaultHome||0):Number(d.defaultOffice||0);
}

const SUN_PATH = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>';
const MOON_PATH = '<path d="M20 14.5A8.5 8.5 0 1110 3.5a7 7 0 0010 11z"/>';
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('blossom07:theme'); }catch(e){}
  const theme = saved === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('blossom07:theme', next); }catch(e){}
  updateThemeIcon();
}
function updateThemeIcon(){
  const icon = document.getElementById('theme-icon');
  if(!icon) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  icon.innerHTML = isDark ? SUN_PATH : MOON_PATH;
}

function t(key){ return (i18n[state.lang] && i18n[state.lang][key]) || i18n.en[key] || key; }

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtPrice(n){ return Number(n).toLocaleString(state.lang === 'ar' ? 'ar-DZ' : (state.lang === 'fr' ? 'fr-DZ' : 'en-US')); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleString(state.lang === 'ar' ? 'ar-DZ' : (state.lang === 'fr' ? 'fr-FR' : 'en-US'), {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}

/* ============ STORAGE ============ */
async function loadData(){
  try{
    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .order('created_at', { ascending: true });

    if(error) throw error;

    state.products = (data || []).map(p => ({
      id: p.id,
      category: p.category,
      price: p.price,
      oldPrice: p.old_price ?? undefined,
      stock: true,
      image: p.image,
      name: p.name,
      desc: p.description
    }));
  }catch(e){
    console.error('loadProducts error:', e);
    state.products = [];
  }
  try{
    const { data, error } = await supabaseClient
      .from('product_images')
      .select('product_id, image_url')
      .order('id', { ascending: true });

    if(error) throw error;

    state.productImages = {};
    (data || []).forEach(row => {
      if(!row.product_id || !row.image_url) return;
      if(!state.productImages[row.product_id]) state.productImages[row.product_id] = [];
      state.productImages[row.product_id].push(row.image_url);
    });
  }catch(e){
    console.error('loadProductImages error:', e);
    state.productImages = {};
  }
  try{
    const r2 = await window.storage.get(STORAGE_ORDERS_KEY, true);
    state.orders = r2 && r2.value ? JSON.parse(r2.value) : [];
  }catch(e){
    state.orders = [];
  }
  try{
  const { data, error } = await supabaseClient
    .from('store_settings')
    .select('data')
    .eq('id', 1)
    .maybeSingle();

  if(error) throw error;

  state.settings = data && data.data
    ? Object.assign(defaultSettings(), data.data)
    : defaultSettings();
  state.settings.delivery = normalizeDelivery(state.settings.delivery);

}catch(e){
  console.error('loadSettings error:', e);
  state.settings = defaultSettings();
}
  state.loaded = true;
  render();
  requestAnimationFrame(setupHeroParallax);
}
async function saveProducts(){
  try{
    const { error } = await supabaseClient
      .from('products')
      .upsert(
        state.products.map(p => ({
          id: p.id,
          name: p.name,
          category: p.category,
          price: p.price,
          old_price: p.oldPrice ?? null,
          image: p.image,
          description: p.desc,
          updated_at: new Date().toISOString()
        })),
        { onConflict: 'id' }
      );

    if(error) throw error;
  }catch(e){
    console.error('saveProducts error:', e);
    showToast('Could not save — please retry.');
  }
}
async function saveProductImages(productId, urls){
  const cleanUrls = [...new Set((urls || []).map(x => String(x || '').trim()).filter(Boolean))];
  try{
    const { error: deleteError } = await supabaseClient
      .from('product_images')
      .delete()
      .eq('product_id', productId);

    if(deleteError) throw deleteError;

    if(cleanUrls.length){
      const { error: insertError } = await supabaseClient
        .from('product_images')
        .insert(cleanUrls.map(image_url => ({ product_id: productId, image_url })));

      if(insertError) throw insertError;
    }

    state.productImages[productId] = cleanUrls;
  }catch(e){
    console.error('saveProductImages error:', e);
    throw e;
  }
}

async function saveOrders(){
  try{
    const rows = state.orders.map(o => ({
      id: o.id,
      data: o,
      created_at: o.createdAt || new Date().toISOString(),
      updated_at: new Date().toISOString()
    }));

    const { error } = await supabaseClient
      .from('orders')
      .upsert(rows, { onConflict: 'id' });

    if(error) throw error;
  }catch(e){
    console.error('saveOrders error:', e);
    showToast('Could not save — please retry.');
  }
}
async function saveSettings(){
  try{
    const { error } = await supabaseClient
      .from('store_settings')
      .upsert({
        id: 1,
        data: state.settings,
        updated_at: new Date().toISOString()
      });

    if(error) throw error;
  }catch(e){
    console.error('saveSettings error:', e);
    showToast('Could not save — please retry.');
  }
}
async function refreshOrders(){
  try{
    const { data, error } = await supabaseClient
      .from('orders')
      .select('id, data, created_at, updated_at')
      .order('created_at', { ascending: false });

    if(error) throw error;

    const fresh = (data || [])
      .map(row => ({
        ...row.data,
        id: row.id
      }))
      .filter(order => order.status !== 'deleted');

    if(JSON.stringify(fresh) !== JSON.stringify(state.orders)){
      state.orders = fresh;
      render();
    }
  }catch(e){
    console.error('refreshOrders error:', e);
  }
}
setInterval(()=>{ if(state.view === 'admin' && state.adminAuthed) refreshOrders(); }, 6000);

function renderModals(){
  let html = '';
  if(state.orderTarget){
    const p = state.products.find(x=>x.id===state.orderTarget);
    if(p) html += renderOrderModal(p);
  }
  if(state.showSuccess){
    html += renderSuccessModal();

  if(state.cartOpen && state.checkoutOpen===true){ html += renderCheckoutModal(); }

  return html;

/* ============ IMAGE HELPERS ============ */
function processImageFile(file){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type.startsWith('image/')){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 900;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.76));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleImageFile(file, fieldEl){
  if(!fieldEl) return;
  const progress = fieldEl.querySelector('[data-progress]');
  if(progress) progress.classList.remove('hidden');
  try{
    const dataUrl = await processImageFile(file);
    const hidden = document.getElementById(fieldEl.dataset.target);
    const preview = fieldEl.querySelector('[data-preview]');
    const removeBtn = fieldEl.querySelector('[data-remove]');
    if(hidden) hidden.value = dataUrl;
    if(preview) preview.innerHTML = `<img src="${dataUrl}">`;
    if(removeBtn) removeBtn.classList.remove('hidden');
  }catch(e){
    showToast(state.lang==='ar' ? 'تعذر تحميل الصورة' : (state.lang==='fr' ? "Impossible de charger l'image" : 'Could not load that image'));
  }
  if(progress) progress.classList.add('hidden');
}

/* ============ SCROLL EFFECTS ============ */
let revealObserver = null;
function setupScrollReveal(){
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add('in'); revealObserver.unobserve(entry.target); }
    });
  }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(el => revealObserver.observe(el));
}
window.addEventListener('scroll', ()=>{
  const header = document.querySelector('.site-header');
  if(header) header.classList.toggle('scrolled', window.scrollY > 30);
}, {passive:true});

const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let heroParallaxBound = false;
function setupHeroParallax(){
  const img = document.querySelector('.hero-bg img');
  if(!img || prefersReducedMotion) return;
  if(heroParallaxBound) return;
  heroParallaxBound = true;
  let ticking = false;
  const update = ()=>{
    const el = document.querySelector('.hero-bg img');
    if(el){
      const offset = Math.min(window.scrollY * 0.28, 90);
      el.style.transform = `scale(1.08) translateY(${offset}px)`;
    }
    ticking = false;
  };
  window.addEventListener('scroll', ()=>{
    if(!ticking){ requestAnimationFrame(update); ticking = true; }
  }, {passive:true});
  update();
}

async function translateText(text, from, to){
  if(!text || from===to) return text||'';
  const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
  const res=await fetch(url);
  if(!res.ok) throw new Error('translation request failed');
  const json=await res.json();
  const translated=json && json.responseData && json.responseData.translatedText;
  if(!translated) throw new Error('no translation returned');
  return translated;
}

  if(openCart) openCart.onclick=()=>{ if(state.view!=='shop') return; state.cartOpen=true; state.checkoutOpen=false; render(); };
  document.querySelectorAll('[data-cart-inc]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.cartInc; state.cart[i].qty++; render(); });
  document.querySelectorAll('[data-cart-dec]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.cartDec; state.cart[i].qty=Math.max(1,state.cart[i].qty-1); render(); });
  document.querySelectorAll('[data-cart-remove]').forEach(b=>b.onclick=()=>{ state.cart.splice(+b.dataset.cartRemove,1); render(); });
  const goCheckout=document.getElementById('go-checkout');
  if(goCheckout) goCheckout.onclick=()=>{ if(state.view!=='shop') return; state.checkoutOpen=true; render(); };
  const addCart=document.getElementById('add-cart-form');
  if(addCart) addCart.onsubmit=(e)=>{
    e.preventDefault();
    if(state.view!=='shop') return;
    const p=state.products.find(x=>x.id===state.orderTarget); if(!p||!p.stock) return;
    const size=document.getElementById('cf-size').value; const qty=Math.max(1,parseInt(document.getElementById('cf-qty').value)||1);
    if(!size){ showToast(t('required_size')); return; }
    const existing=state.cart.find(x=>x.productId===p.id && x.size===size);
    if(existing) existing.qty+=qty; else state.cart.push({productId:p.id,productName:p.name, name:p.name, desc:p.desc, price:Number(p.price)||0, image:p.image, size, qty});
    state.orderTarget=null; state.cartOpen=true; state.checkoutOpen=false; render(); showToast(t('cart_added'));
  };

  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.adminTab=b.dataset.tab; render(); });
  const deliveryForm=document.getElementById('delivery-form');
  if(deliveryForm) deliveryForm.onsubmit=async(e)=>{
    e.preventDefault(); const d=normalizeDelivery(state.settings.delivery);
    d.defaultHome=Math.max(0,Number(document.getElementById('dd-home').value)||0); d.defaultOffice=Math.max(0,Number(document.getElementById('dd-office').value)||0);
    WILAYAS.forEach(([code])=>{ d.home[code]=Math.max(0,Number(document.querySelector(`[data-delivery-home="${code}"]`).value)||0); d.office[code]=Math.max(0,Number(document.querySelector(`[data-delivery-office="${code}"]`).value)||0); });
    state.settings=Object.assign({},state.settings,{delivery:d}); await saveSettings(); showToast(t('delivery_saved'));
  };

  const deliverySelect=document.getElementById('co-delivery');
  const wilayaSelect=document.getElementById('co-wilaya');
  const updateCheckoutTotals=()=>{
    const type=deliverySelect?deliverySelect.value:'home'; const code=wilayaSelect?wilayaSelect.value:''; const fee=deliveryPrice(type,code); const sub=cartSubtotal();
    const f=document.getElementById('co-delivery-fee'), g=document.getElementById('co-grand-total');
    if(f) f.textContent=`${fmtPrice(fee)} ${t('price_da')}`; if(g) g.textContent=`${fmtPrice(sub+fee)} ${t('price_da')}`;
  };
  const addressInput=document.getElementById('co-address');
  const addressLabel=document.getElementById('co-address-label');
  const updateAddressRequirement=()=>{
    const home=deliverySelect ? deliverySelect.value==='home' : true;
    if(addressInput) addressInput.required=home;
    if(addressLabel) addressLabel.textContent = home ? `${t('address_optional').replace('optional','').replace('facultative','').replace('اختياري','').trim()} *` : t('address_optional');
  };
  if(deliverySelect) deliverySelect.onchange=()=>{ updateCheckoutTotals(); updateAddressRequirement(); };
  if(wilayaSelect) wilayaSelect.onchange=updateCheckoutTotals;
  updateAddressRequirement();

  const checkoutForm=document.getElementById('checkout-form');
  if(checkoutForm) checkoutForm.onsubmit=async(e)=>{
    e.preventDefault();
    if(state.view!=='shop') return;
    const name=document.getElementById('co-name').value.trim();
    const phone=document.getElementById('co-phone').value.replace(/\s+/g,'').trim();
    const deliveryType=document.getElementById('co-delivery').value;
    const wilaya=document.getElementById('co-wilaya').value;
    const address=document.getElementById('co-address').value.trim();
    const note=document.getElementById('co-note').value.trim();
    if(!name || !phone || !phoneIsValid(phone)){ showToast(t('phone_invalid')); return; }
    if(!wilaya){ showToast(t('required')); return; }
    if(deliveryType==='home' && !address){ showToast(t('required')); return; }
    if(!state.cart.length){ showToast(t('cart_empty')); return; }
    const subtotal=cartSubtotal(); const delivery=deliveryPrice(deliveryType,wilaya); const total=subtotal+delivery;
    const order={
      id:'o'+Date.now()+Math.random().toString(36).slice(2,7),
      items:state.cart.map(x=>({productId:x.productId,productName:x.name,price:x.price,size:x.size,qty:x.qty,image:x.image})),
      productName:state.cart.length===1?(state.cart[0].name[state.lang]||state.cart[0].name.en):`${state.cart.length} ${t('cart_items')}`,
      price:subtotal, qty:1, subtotal, deliveryType, deliveryFee:delivery, total,
      wilayaCode:wilaya, wilayaName:(WILAYAS.find(x=>x[0]===wilaya)||[])[1]||'',
      name, phone, address, note, status:'new', createdAt:new Date().toISOString()
    };
    try{
      const {error}=await supabaseClient.from('orders').insert({id:order.id,data:order,created_at:order.createdAt,updated_at:order.createdAt});
      if(error) throw error;
      state.orders.unshift(order); state.cart=[]; state.cartOpen=false; state.checkoutOpen=false; state.showSuccess=true; render();
    }catch(err){ console.error('checkout error',err); showToast('Could not place order — please retry.'); }
  };

  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.close;
    if(k==='order') state.orderTarget=null;
    if(k==='cart') {state.cartOpen=false; state.checkoutOpen=false;}
    if(k==='checkout') state.checkoutOpen=false;
    if(k==='success') state.showSuccess=false;
    if(k==='product') state.editingProduct=null;
    render();
  });

  const saleToggle=document.getElementById('pf-sale');
  const salePriceWrap=document.getElementById('pf-sale-price-wrap');
  const oldPriceField=document.getElementById('pf-old-price');
  if(saleToggle){
    saleToggle.onchange=()=>{
      const on=saleToggle.checked;
      if(salePriceWrap) salePriceWrap.style.display=on ? '' : 'none';
      if(oldPriceField){ oldPriceField.required=on; if(!on) oldPriceField.value=''; }
    };
    if(oldPriceField) oldPriceField.required=saleToggle.checked;
  }

  const pf=document.getElementById('product-form');
  const sourceSel=document.getElementById('pf-source-lang');
  if(sourceSel) sourceSel.onchange=()=>{ state.productSourceLang=sourceSel.value; render(); };
  if(pf) pf.onsubmit=async(e)=>{
    e.preventDefault();

    // Prevent double/triple clicks from creating duplicate products.
    if(pf.dataset.saving === '1') return;
    pf.dataset.saving = '1';
    const saveBtn = pf.querySelector('button[type="submit"]');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.style.opacity = '0.6'; saveBtn.style.cursor = 'not-allowed'; }
    const unlockSave = ()=>{
      pf.dataset.saving = '0';
      if(saveBtn){ saveBtn.disabled = false; saveBtn.style.opacity = ''; saveBtn.style.cursor = ''; }
    };

    const source=document.getElementById('pf-source-lang').value;
    const sourceName=document.getElementById('pf-name-source').value.trim();
    const sourceDesc=document.getElementById('pf-desc-source').value.trim();
    const price=parseFloat(document.getElementById('pf-price').value);
    const saleEnabled=!!document.getElementById('pf-sale')?.checked;
    const oldPriceValue=parseFloat(document.getElementById('pf-old-price')?.value);
    const oldPrice=saleEnabled ? oldPriceValue : null;
    if(isNaN(price)){ showToast(t('required')); unlockSave(); return; }
    if(saleEnabled && (isNaN(oldPrice) || oldPrice <= price)){
      showToast('Prix avant solde doit être supérieur au prix soldé.');
      unlockSave();
      return;
    }

    let name, desc;

    if(state.editingProduct === 'new'){
      if(!sourceName){ showToast(t('required')); unlockSave(); return; }

      name={en:'',fr:'',ar:''};
      desc={en:'',fr:'',ar:''};
      name[source]=sourceName;
      desc[source]=sourceDesc;

      const other=['en','fr','ar'].filter(x=>x!==source);
      try{
        for(const to of other){
          name[to]=await translateText(sourceName,source,to);
          if(sourceDesc) desc[to]=await translateText(sourceDesc,source,to);
        }
      }catch(err){
        console.error('translation error',err);
        showToast(t('translation_failed'));
        unlockSave();
        return;
      }
    }
    const extraImageUrls = [...document.querySelectorAll('[data-extra-image]')].map(input=>input.value.trim()).filter(Boolean);
    const isEditingExisting = state.editingProduct !== 'new';

    if(isEditingExisting){
      const idx = state.products.findIndex(p=>p.id===state.editingProduct);
      if(idx === -1){ unlockSave(); return; }

      const existing = state.products[idx];
      const updatedName = {...existing.name};
      const updatedDesc = {...existing.desc};

      if(sourceName) updatedName[source] = sourceName;
      if(sourceDesc) updatedDesc[source] = sourceDesc;

      const data = {
        ...existing,
        category: document.getElementById('pf-category').value,
        price,
        oldPrice,
        image: extraImageUrls[0] || existing.image || '', 
        stock: document.getElementById('pf-stock').checked,
        name: updatedName,
        desc: updatedDesc,
        sourceLang: source
      };

      state.products[idx] = data;

      try{
        await saveProducts();
        await saveProductImages(data.id, extraImageUrls);
      }catch(err){
        console.error('save product/images error:', err);
        showToast('Could not save product images — please retry.');
        unlockSave();
        return;
      }
    }else{
      const data = {
        id:'p'+Date.now(),
        category:document.getElementById('pf-category').value,
        price,
        oldPrice,
        image:extraImageUrls[0]||'',
        stock:document.getElementById('pf-stock').checked,
        name,
        desc,
        sourceLang:source
      };

      state.products.push(data);

      try{
        await saveProducts();
        await saveProductImages(data.id, extraImageUrls);
      }catch(err){
        console.error('save product/images error:', err);
        showToast('Could not save product images — please retry.');
        unlockSave();
        return;
      }
    }
    unlockSave();
    state.editingProduct=null; state.productSourceLang=null; render(); showToast(state.lang==='ar'?'تم الحفظ':(state.lang==='fr'?'Enregistré':'Saved'));
  };
}


async function restoreRememberedAdmin(){
  try{
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const user = sessionData && sessionData.session && sessionData.session.user;
    if(!user) return;

    const { data: adminData, error } = await supabaseClient
      .from('admin_users')
      .select('user_id')
      .eq('user_id', user.id)
      .maybeSingle();

    if(error || !adminData){
      try{ localStorage.removeItem('blossom_admin_remember'); }catch(e){}
      return;
    }

    state.adminAuthed=true;
    state.view='admin';
    refreshOrders();
    render();
  }catch(e){
    console.error('restore remembered admin error:', e);
  }
}

loadData().then(restoreRememberedAdmin);
</script>
