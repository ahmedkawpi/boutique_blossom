<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blossom07 — Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<meta name="blossom-sale-fix" content="v2">

<style id="blossom-sample-theme">
:root{--sample-bg:#fff;--sample-text:#2d2529;--sample-muted:#85777d;--sample-line:#eee7ea;--sample-pink:#a45f7d}
body{background:var(--sample-bg)}
.sample-header{height:72px;max-width:1280px;margin:0 auto;border-bottom:1px solid var(--sample-line);padding:0 28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(255,255,255,.96);position:sticky;top:0;z-index:30;box-shadow:none}
.sample-nav-left,.sample-header-actions{display:flex;align-items:center;gap:8px}.sample-nav-left{justify-content:flex-start}.sample-header-actions{justify-content:flex-end}
.sample-nav-link{background:none;border:0;color:var(--sample-muted);font-size:12px;padding:7px 9px;text-decoration:none}.sample-nav-link:hover,.sample-nav-link.active{color:var(--sample-text)}
.sample-logo{cursor:pointer;display:flex;align-items:center;gap:5px;font-family:Georgia,serif;font-size:25px;letter-spacing:-.7px;color:#34282e}.sample-logo-flower{font-family:Georgia,serif;color:var(--sample-pink);font-size:23px;transform:rotate(-8deg)}
.sample-header .lang-switch{border:0;padding:0;gap:2px}.sample-header .lang-switch button{font-size:10px;padding:5px 6px;background:none}.sample-header .lang-switch button.active{color:var(--sample-pink);background:#faf3f6}
.sample-icon-btn{position:relative;width:32px;height:32px;padding:0;border:0;background:none;color:#54464d;display:inline-flex;align-items:center;justify-content:center}.sample-icon-btn b{position:absolute;right:0;top:0;min-width:13px;height:13px;border-radius:50%;background:var(--sample-pink);color:white;font-size:8px;line-height:13px}
.sample-intro{text-align:center;padding:46px 18px 28px}.sample-floral-line{color:#c88ba3;font-size:17px;letter-spacing:2px;margin-bottom:12px}.sample-intro h1{font-size:23px;font-weight:500;letter-spacing:.04em;margin:0;color:#383034}.sample-intro h1 span{font-size:14px;color:#a88e99;margin-left:4px}.sample-intro p{max-width:560px;margin:11px auto 0;color:var(--sample-muted);font-size:12px;line-height:1.7}
.category-bar{max-width:1280px;margin:0 auto 22px;padding:0 28px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;border:0}.category-bar .chip{background:transparent;border:1px solid transparent;color:#82747b;border-radius:3px;font-size:11px;padding:7px 13px}.category-bar .chip.active{background:#f7edf2;color:#8e4e6c;border-color:#ead8e0}
.shop-wrap{max-width:1280px;margin:0 auto;padding:0 28px 65px}.shop-head{display:none}.shop-wrap>.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 14px}.card{background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}.card:hover{transform:none}.card .thumb{height:auto;aspect-ratio:4/5;border-radius:4px;background:#f5f1f3;overflow:hidden}.card .thumb img{transition:transform .35s ease}.card:hover .thumb img{transform:scale(1.025)}.card-body{padding:10px 3px 0}.card-cat{text-transform:uppercase;letter-spacing:.08em;font-size:8px;color:#9a8b91;margin-bottom:5px}.card-name{font-size:12px;font-weight:500;color:#3c3237;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-desc{display:none}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:5px}.price{font-size:11px;font-weight:700;color:#473940}.price small{font-size:8px;color:#97888e}.order-btn{font-size:9px;padding:5px 8px;border-radius:3px}.stock-badge{top:8px;left:8px;font-size:8px}.card-tag{font-size:8px;padding:4px 6px;border-radius:2px}.site-footer{margin-top:25px}
@media(max-width:1000px){.shop-wrap>.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:720px){.sample-header{height:62px;padding:0 12px;grid-template-columns:1fr auto 1fr}.sample-nav-left .sample-nav-link:nth-child(2){display:none}.sample-nav-left{gap:0}.sample-nav-link{font-size:10px;padding:6px 5px}.sample-logo{font-size:20px}.sample-logo-flower{font-size:19px}.sample-header .lang-switch{display:flex}.sample-intro{padding:34px 15px 22px}.sample-intro h1{font-size:18px}.shop-wrap{padding:0 12px 45px}.category-bar{padding:0 10px;margin-bottom:18px}.shop-wrap>.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 10px}.card-body{padding-top:8px}.card-name{font-size:11px}.order-btn{display:none}}

/* ===== Blossom visual upgrade v3 ===== */
:root{
  --sample-bg:#fffafb;
  --sample-text:#30252b;
  --sample-muted:#9a8790;
  --sample-line:rgba(84,55,68,.10);
  --sample-pink:#b85f82;
  --sample-card:#ffffff;
  --sample-section:#fffdfd;
}
[data-theme="dark"]{
  --sample-bg:#120d11;
  --sample-text:#f6edf1;
  --sample-muted:#c2aeb8;
  --sample-line:rgba(255,255,255,.11);
  --sample-pink:#ef7eaa;
  --sample-card:#1c1419;
  --sample-section:#171015;
  --cream:#120d11;
  --white:#1c1419;
  --plum:#f6edf1;
  --plum-soft:#c2aeb8;
  --pink-pale:#241820;
  --pink-light:#38202d;
  --line:rgba(255,255,255,.11);
}
html,body,#app{background:var(--sample-bg);color:var(--sample-text);}
body{min-height:100vh;transition:background .35s ease,color .35s ease;}
.site-header.sample-header{background:color-mix(in srgb,var(--sample-bg) 94%,transparent);color:var(--sample-text);border-color:var(--sample-line);}
[data-theme="dark"] .site-header.sample-header{background:rgba(18,13,17,.94);}
.sample-nav-link{color:var(--sample-muted)!important;}
.sample-nav-link:hover,.sample-nav-link.active{color:var(--sample-text)!important;}
.sample-logo{color:var(--sample-text)!important;}
.sample-icon-btn{color:var(--sample-text)!important;}
.sample-header .lang-switch{background:transparent;}
.sample-header .lang-switch button{color:var(--sample-muted)!important;}
.sample-header .lang-switch button.active{background:rgba(184,95,130,.13)!important;color:var(--sample-pink)!important;}
.theme-toggle{background:var(--sample-card);color:var(--sample-text);border-color:var(--sample-line);}

/* More visual hierarchy */
.sample-intro{
  position:relative;
  max-width:1280px;
  margin:0 auto;
  padding:72px 28px 34px;
  isolation:isolate;
}
.sample-intro::before,.sample-intro::after{
  content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(2px);pointer-events:none;
}
.sample-intro::before{width:220px;height:220px;left:2%;top:10px;background:radial-gradient(circle,rgba(205,126,158,.13),transparent 68%);}
.sample-intro::after{width:260px;height:260px;right:3%;top:0;background:radial-gradient(circle,rgba(205,126,158,.10),transparent 68%);}
.sample-floral-line{font-size:20px;color:var(--sample-pink);letter-spacing:7px;text-shadow:0 8px 25px rgba(184,95,130,.16);}
.sample-intro h1{font-family:var(--font-display);font-size:34px;font-weight:500;letter-spacing:.01em;color:var(--sample-text);margin:0;}
.sample-intro h1 span{font-family:var(--font-body);font-size:13px;color:var(--sample-muted);}
.sample-intro p{color:var(--sample-muted);font-size:13px;max-width:620px;}
.category-bar{max-width:1280px;margin:0 auto 34px;padding:0 28px;gap:10px;}
.category-bar .chip{color:var(--sample-muted);border:1px solid transparent;background:transparent;padding:9px 17px;font-size:12px;border-radius:999px;transition:.25s ease;}
.category-bar .chip:hover{color:var(--sample-pink);background:rgba(184,95,130,.07);}
.category-bar .chip.active{background:rgba(184,95,130,.12);color:var(--sample-pink);border-color:rgba(184,95,130,.20);box-shadow:0 8px 20px rgba(184,95,130,.08);}

.shop-wrap{
  max-width:1320px;
  padding:0 28px 90px;
  position:relative;
}
.shop-wrap::before{
  content:"";position:absolute;left:28px;right:28px;top:0;height:1px;background:var(--sample-line);
}
.shop-wrap>.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:52px 24px;
  padding-top:30px;
}
.card{
  background:var(--sample-card);
  border:1px solid var(--sample-line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 28px rgba(55,30,43,.055);
  transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease,background .35s ease;
}
.card:hover{
  transform:translateY(-7px);
  box-shadow:0 22px 48px rgba(55,30,43,.13);
  border-color:rgba(184,95,130,.22);
}
[data-theme="dark"] .card{box-shadow:0 14px 35px rgba(0,0,0,.25);}
[data-theme="dark"] .card:hover{box-shadow:0 24px 55px rgba(0,0,0,.40);}
.card .thumb{
  aspect-ratio:4/5.25;
  height:auto;
  border-radius:0;
  background:linear-gradient(145deg,rgba(244,235,239,.9),rgba(250,246,248,.9));
  position:relative;
}
[data-theme="dark"] .card .thumb{background:linear-gradient(145deg,#21171d,#2a1d24);}
.card .thumb::after{
  content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 68%,rgba(20,10,16,.10));opacity:.65;transition:.3s;
}
.card:hover .thumb::after{opacity:.9;}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.22,.75,.28,1);}
.card:hover .thumb img{transform:scale(1.055);}
.card-body{padding:15px 15px 17px;background:var(--sample-card);}
.card-cat{text-transform:uppercase;letter-spacing:.12em;font-size:9px;color:var(--sample-pink);font-weight:700;margin-bottom:6px;}
.card-name{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--sample-text);margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-desc{display:block!important;color:var(--sample-muted);font-size:11px;line-height:1.6;margin:0 0 13px;min-height:35px;}
.card-foot{border-top:1px solid var(--sample-line);padding-top:11px;}
.price{font-size:13px;font-weight:800;color:var(--sample-text);}
.price small{font-size:9px;color:var(--sample-muted);}
.order-btn{font-size:10px;padding:7px 11px;border-radius:999px;background:var(--sample-pink);border:1px solid var(--sample-pink);color:#fff;box-shadow:0 7px 16px rgba(184,95,130,.18);transition:.25s ease;}
.order-btn:hover{transform:translateY(-1px);filter:brightness(1.04);}
.card-tag,.stock-badge{z-index:2;box-shadow:0 6px 14px rgba(0,0,0,.08);}
.stock-badge{top:12px!important;left:12px!important;}

/* Make the whole page participate in dark mode */
[data-theme="dark"] .sample-intro h1,
[data-theme="dark"] .card-name,
[data-theme="dark"] .price,
[data-theme="dark"] .sample-logo{color:var(--sample-text)!important;}
[data-theme="dark"] .site-footer,
[data-theme="dark"] .site-footer *{color:inherit;}
[data-theme="dark"] .site-footer{background:#0d090c!important;border-color:var(--sample-line)!important;}
[data-theme="dark"] .site-footer a{color:var(--sample-muted)!important;}
[data-theme="dark"] .site-footer .brand-mark{color:var(--sample-pink)!important;}
[data-theme="dark"] .modal{background:var(--sample-card)!important;color:var(--sample-text)!important;border-color:var(--sample-line)!important;}
[data-theme="dark"] .modal input,
[data-theme="dark"] .modal select,
[data-theme="dark"] .modal textarea{background:#241920!important;color:var(--sample-text)!important;border-color:var(--sample-line)!important;}
[data-theme="dark"] .category-bar .chip{color:var(--sample-muted);}

@media(max-width:1000px){
  .shop-wrap>.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 18px;}
}
@media(max-width:700px){
  .sample-intro{padding:52px 16px 24px;}
  .sample-intro h1{font-size:27px;}
  .category-bar{padding:0 16px;margin-bottom:22px;}
  .shop-wrap{padding:0 14px 60px;}
  .shop-wrap::before{left:14px;right:14px;}
  .shop-wrap>.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 10px;padding-top:22px;}
  .card{border-radius:12px;}
  .card-body{padding:11px 10px 12px;}
  .card-name{font-size:14px;}
  .card-desc{font-size:10px;min-height:32px;}
  .card-foot{display:block;}
  .price{margin-bottom:9px;}
  .order-btn{width:100%;}
}


/* Mobile compact catalog — keep the desktop-like proportions */
@media (max-width:720px){
  .shop-wrap{padding:0 14px 42px;}
  .shop-wrap>.grid{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:18px 10px !important;
  }
  .card .thumb{aspect-ratio:4/5 !important;border-radius:7px;}
  .card-body{padding:7px 2px 0 !important;}
  .card-cat{font-size:7px !important;margin-bottom:3px !important;}
  .card-name{
    font-size:11px !important;
    line-height:1.25 !important;
    margin-bottom:5px !important;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .card-desc{display:none !important;}
  .card-colors{font-size:8px !important;margin-bottom:5px !important;}
  .price{font-size:10px !important;gap:4px !important;}
  .price small{font-size:7px !important;}
  .order-btn{display:none !important;}
  .stock-badge,.card-tag{font-size:7px !important;padding:3px 6px !important;top:6px !important;}
  .category-bar{padding:0 10px !important;margin-bottom:15px !important;gap:4px !important;}
  .category-bar .chip{font-size:9px !important;padding:6px 9px !important;}
  .sample-intro{padding:28px 14px 18px !important;}
  .sample-intro h1{font-size:19px !important;}
  .sample-intro p{font-size:10px !important;line-height:1.5 !important;}
}
</style>

<style id="blossom-fluid-width-fix">
@media (min-width:721px){
  .sample-header,.lookbook,.cat-section,.feature-row,.cta-banner,.category-bar,.shop-wrap,
  .site-footer .footer-inner,.site-footer .footer-bottom{
    width:calc(100% - 40px);
    max-width:1440px;
    box-sizing:border-box;
  }
  .sample-header{margin-left:auto;margin-right:auto;padding-left:28px;padding-right:28px;}
  .lookbook,.cat-section,.feature-row,.cta-banner,.category-bar,.shop-wrap{margin-left:auto;margin-right:auto;}
  .lookbook,.cat-section,.feature-row,.cta-banner,.category-bar,.shop-wrap{max-width:1440px;}
  .shop-wrap>.grid,.new-grid,.cat-grid{width:100%;}
}
@media (max-width:720px){.sample-header{width:100%;}}
</style>
</head>
<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

</body>
